[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-to-document"
version = "0.1.0"
description = "Convert YouTube transcripts into readable documents."
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default]",
]

[project.optional-dependencies]
documents = [
    "python-docx>=1.2,<2",
    "fpdf2>=2.8,<3",
    "fonttools>=4,<5",
]
transcription = [
    "faster-whisper>=1.1,<2",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["yt_document*"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["yt_document"]